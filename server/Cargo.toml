[package]
name = "ward-server"
version = "0.1.0"
edition = "2024"
description = "WARD - Wayland Android Remote Desktop server"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# D-Bus for XDG Desktop Portal communication
zbus = { version = "5", default-features = false, features = ["tokio"] }

# PipeWire for receiving screen capture frames
pipewire = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization (for config, protocol)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image handling (for milestone 1 verification - save captured frames)
image = "0.25"

# Async stream utilities (for D-Bus signal handling)
futures-util = "0.3"

# libc for low-level fd operations (dup)
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
