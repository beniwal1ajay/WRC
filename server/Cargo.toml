[package]
name = "ward-server"
version = "0.1.0"
edition = "2024"
description = "WARD - Wayland Android Remote Desktop server"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# D-Bus for XDG Desktop Portal communication
zbus = { version = "5", default-features = false, features = ["tokio"] }

# PipeWire for receiving screen capture frames
pipewire = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization (for config, protocol)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image handling (for milestone 1 verification - save captured frames)
image = { version = "0.25", default-features = false, features = ["png"] }

# Async stream utilities (for D-Bus signal handling)
futures-util = "0.3"

# libc for low-level fd operations (dup)
libc = "0.2"

# H.264 video encoding
openh264 = "0.9"

# TLS 1.3 networking
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
rand_core = { version = "0.6", features = ["std"] }
ring = "0.17"
md-5 = "0.11.0"

[dev-dependencies]
tokio-test = "0.4"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
